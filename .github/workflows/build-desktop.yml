name: Build Desktop Installers

# Manual trigger only for now — wire to `push: tags: ['v*']` once this is proven out on all
# three platforms. Windows .exe / macOS .app+.dmg / Linux AppImage artifacts can't be produced
# or tested outside real per-OS runners, which is exactly what this workflow exists to provide.
on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux GTK/WebKit2 runtime deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-dev

      - name: Install desktop requirements
        run: pip install -r requirements-desktop.txt

      # Built here (not committed) since generating a real .icns needs macOS's own iconutil —
      # same "generate on the OS that needs it" approach as the Windows WebView2 bootstrapper
      # below. Must run before PyInstaller: inventory.spec's BUNDLE() step reads this file.
      - name: Generate macOS app icon (icns)
        if: matrix.os == 'macos-latest'
        run: |
          SRC=static/images/app-icon.png
          ICONSET=desktop/macos/icon.iconset
          mkdir -p "$ICONSET"
          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o desktop/macos/icon.icns

      - name: Build with PyInstaller
        run: pyinstaller desktop/inventory.spec

      # --- Per-OS packaging ---------------------------------------------------------------
      # Windows: Inno Setup script wraps the PyInstaller onedir build into a real installer
      # with a Start Menu shortcut and a WebView2 runtime bootstrapper check.
      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # Fetched at build time rather than committed — Microsoft updates this bootstrapper
      # independently of our release cadence, and it's a large binary that doesn't belong in git.
      # installer.iss embeds it (Files: dontcopy) and only runs it if WebView2 isn't already
      # present on the target machine.
      - name: Download WebView2 Runtime bootstrapper
        if: matrix.os == 'windows-latest'
        run: curl.exe -Lo desktop\windows\MicrosoftEdgeWebView2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\windows\installer.iss "/DMyAppVersion=${{ steps.version.outputs.version }}"'

      # macOS: .app bundle (built by inventory.spec's BUNDLE() step) -> ad-hoc signed -> .dmg.
      # Not notarized (needs a paid Apple Developer account — a deliberate later step, not a v1
      # blocker), so Gatekeeper still requires right-click → Open on first launch. Ad-hoc signing
      # (no certificate needed) is still worth doing: a *completely* unsigned app downloaded from
      # the internet often gets Apple Silicon's harsher "app is damaged" false-positive instead of
      # the milder "unidentified developer" prompt.
      - name: Ad-hoc codesign + package macOS .dmg
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - "dist/Guns & Reloading.app"

          # Stage the classic drag-to-install layout: the app plus a symlink to /Applications,
          # side by side. Pointing hdiutil straight at the .app (the previous approach) puts only
          # the app in the dmg — there's nothing to drag it onto, and it's not obvious the app
          # even needs to leave the mounted disk image at all.
          STAGING="dist/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "dist/Guns & Reloading.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          mkdir -p dist/installer
          DMG_PATH="dist/installer/GunsAndReloading-Setup-${{ steps.version.outputs.version }}.dmg"
          hdiutil create -volname "Guns & Reloading" -srcfolder "$STAGING" -ov -format UDZO "$DMG_PATH"

          # Verify the dmg's actual contents right here rather than trusting it worked — mount it
          # back and confirm both the app and the Applications symlink are really inside.
          MOUNT_POINT="$(mktemp -d)"
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -nobrowse -quiet
          echo "--- DMG contents ---"
          ls -la "$MOUNT_POINT"
          [ -e "$MOUNT_POINT/Guns & Reloading.app" ] || { echo "::error::App bundle missing from dmg"; exit 1; }
          [ -L "$MOUNT_POINT/Applications" ] || { echo "::error::Applications symlink missing from dmg"; exit 1; }
          hdiutil detach "$MOUNT_POINT" -quiet

      # Linux: AppImage — most portable, no package-manager dependency, but still needs the
      # GTK/WebKit2 runtime libs present on the host system (installed above for THIS build, but
      # NOT bundled into the AppImage itself — a fresh distro needs its own gtk3/webkit2gtk
      # packages installed first; document this in release notes/docs).
      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          APPDIR=dist/AppDir
          mkdir -p "$APPDIR/usr/bin" dist/installer
          cp -r dist/InventoryAndReloading/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/AppRun" <<'RUNEOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/InventoryAndReloading" "$@"
          RUNEOF
          chmod +x "$APPDIR/AppRun"

          cp static/images/icon-512.png "$APPDIR/guns-and-reloading.png"

          cat > "$APPDIR/guns-and-reloading.desktop" <<'DESKTOPEOF'
          [Desktop Entry]
          Type=Application
          Name=Guns & Reloading
          Exec=AppRun
          Icon=guns-and-reloading
          Categories=Utility;
          DESKTOPEOF

          curl -Lo appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          # appimagetool is itself packaged as an AppImage, which normally needs FUSE to run —
          # this headless CI runner doesn't have it, so extract-and-run instead.
          ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "dist/installer/GunsAndReloading-Setup-${{ steps.version.outputs.version }}-x86_64.AppImage"

      # All three OSes have real installers now — upload just those, not the raw onedir/.app
      # build (a few hundred MB of bundled Python runtime nobody needs pulled out of CI).
      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installer/*.exe

      - name: Upload macOS installer
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installer/*.dmg

      - name: Upload Linux installer
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installer/*.AppImage
