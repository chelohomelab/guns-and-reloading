name: Build Desktop Installers

# Manual trigger only for now — wire to `push: tags: ['v*']` once this is proven out on all
# three platforms. Windows .exe / macOS .app+.dmg / Linux AppImage artifacts can't be produced
# or tested outside real per-OS runners, which is exactly what this workflow exists to provide.
on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux GTK/WebKit2 runtime deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-dev

      - name: Install desktop requirements
        run: pip install -r requirements-desktop.txt

      - name: Build with PyInstaller
        run: pyinstaller desktop/inventory.spec

      # --- Per-OS packaging ---------------------------------------------------------------
      # Windows: Inno Setup script wraps the PyInstaller onedir build into a real installer
      # with a Start Menu shortcut and a WebView2 runtime bootstrapper check.
      - name: Read app version
        if: matrix.os == 'windows-latest'
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # Fetched at build time rather than committed — Microsoft updates this bootstrapper
      # independently of our release cadence, and it's a large binary that doesn't belong in git.
      # installer.iss embeds it (Files: dontcopy) and only runs it if WebView2 isn't already
      # present on the target machine.
      - name: Download WebView2 Runtime bootstrapper
        if: matrix.os == 'windows-latest'
        run: curl.exe -Lo desktop\windows\MicrosoftEdgeWebView2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\windows\installer.iss "/DMyAppVersion=${{ steps.version.outputs.version }}"'

      # macOS: .app bundle -> .dmg. Unsigned/unnotarized for now (Apple Developer account is a
      # deliberate later step, not a v1 blocker) — expect a Gatekeeper warning on first launch.
      - name: Package macOS .dmg
        if: matrix.os == 'macos-latest'
        run: |
          echo "TODO: create-dmg or hdiutil against dist/InventoryAndReloading.app"
          echo "Requires the PyInstaller build to produce a .app bundle first."

      # Linux: AppImage — most portable, no package-manager dependency, but still needs the
      # GTK/WebKit2 runtime libs present on the host system (installed above for this build,
      # NOT bundled into the AppImage itself — document this in release notes).
      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "TODO: appimagetool against dist/InventoryAndReloading"
          echo "Requires appimagetool to be downloaded/installed in this job first."

      # Windows already has a real installer, so only upload that (the raw onedir build is a
      # few hundred MB of bundled Python runtime, not something anyone needs from CI). macOS/
      # Linux still upload the raw PyInstaller output until their packaging steps are written.
      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installer/*.exe

      - name: Upload raw build output
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/**
